name: Deploy Actor to Apify

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        env:
          USE_PLAYWRIGHT_SOURCE: "0"
          RATE_LIMIT_PER_MINUTE: "10000"
          MAX_JOBS_PER_HOUR: "0"
        run: |
          pytest -v

  deploy:
    name: Build & Deploy to Apify
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Actor to Apify
        id: apify-push
        uses: apify/push-actor-action@v1
        with:
          token: ${{ secrets.APIFY_TOKEN }}
          actor-id: ${{ secrets.APIFY_ACTOR_ID }}
          build-tag: "latest"

      - name: Summary
        run: |
          echo "### 🚀 Apify Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Build ID:** \`${{ steps.apify-push.outputs.build-id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Number:** \`${{ steps.apify-push.outputs.build-number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** \`${{ steps.apify-push.outputs.build-status }}\`" >> $GITHUB_STEP_SUMMARY
